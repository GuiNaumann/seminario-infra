name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build com matriz de versões do Go
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ["1.21", "1.22"]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Baixar dependências
        run: go mod download

      - name: Compilar binário
        run: go build -o biblioteca-api .

      - name: Upload do binário (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: biblioteca-api-go${{ matrix.go-version }}
          path: biblioteca-api
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Testes (roda em paralelo com o build)
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Baixar dependências
        run: go mod download

      - name: Rodar testes
        run: go test -v -cover ./...

      - name: Mostrar uso do secret (exemplo seguro)
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "Secret API_KEY está configurado (valor mascarado pelo GitHub)"
          else
            echo "Secret API_KEY não configurado (ok em PRs externas)"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: CD - Push da imagem no Docker Hub (só na main, depois de build+test)
  # ─────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Hub
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push (latest + SHA)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/biblioteca-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/biblioteca-api:${{ github.sha }}
